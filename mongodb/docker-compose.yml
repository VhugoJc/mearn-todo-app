version: '3.8'

services:
  mongodb:
    build: .
    container_name: mean-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: meantodo
    volumes:
      - mongodb_data:/data/db
    networks:
      - mongo-network

volumes:
  mongodb_data:
    driver: local

networks:
  mongo-network:
    driver: bridge
